# EC2 운영 프로파일 (--spring.profiles.active=prod)
# DB_PASSWORD는 systemd EnvironmentFile(/etc/financialw/env)에서 주입된다

spring.datasource.url=jdbc:mysql://localhost:3306/financial?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=financial
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false

# nginx 뒤에서 X-Forwarded-* 헤더로 원래 스킴/호스트를 인식
server.forward-headers-strategy=framework

kakao.redirect-uri=https://www.financialw.kro.kr/auth/kakao/callback

app.front-base-url=https://app.financialw.kro.kr
app.cookie-secure=true
